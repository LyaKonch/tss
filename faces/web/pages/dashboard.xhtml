<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

    <f:metadata />    <!-- Use jakarta.faces.core - else might be autoremoved by IntelliJ -->

    <ui:insert name="metadata" />

    <ui:param name="pageHeadline" value="${msg.homepageHeadline}" />

    <ui:define name="content">
        <h:form>
            <p:panel header="Welcome to Bravo Timesheet System">
                <p>Welcome to the Bravo Timesheet System. Please use the navigation menu to access different features.</p>

                <p:panelGrid columns="2" styleClass="ui-noborder">
                    <p:panel header="Contracts">
                        <p>Manage your contracts</p>
                        <p:button outcome="contractList" value="View Contracts" icon="pi pi-file" />
                    </p:panel>

                    <p:panel header="Timesheets">
                        <p>Manage your timesheets (soon)</p>
                        <p:button outcome="/pages/user/timesheetEdit" value="Edit Timesheets" icon="pi pi-calendar" />
                    </p:panel>
                </p:panelGrid>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
