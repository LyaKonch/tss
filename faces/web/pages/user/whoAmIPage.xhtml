<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login</title>
</h:head>
<h:body>
    <h:form id="whoamiForm">
        <h:commandButton value="Who am I?" action="#{whoAmIBean.load}" />
        <h:panelGroup rendered="#{not empty whoAmIBean.username }">
            <h:outputText value="You are: #{whoAmIBean.username}" /><br/>
            <h:outputText value="Groups: " />
            <h:outputText value="#{whoAmIBean.groups}" />
        </h:panelGroup>
    </h:form>
</h:body>
</html>
