<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">
    <p:dialog header="#{contractEditBean.contract.name}" widgetVar="editDialog" modal="true"
              closable="true" resizable="true" responsive="true" closeOnEscape="true"
              rendered="#{not empty contractEditBean.contract}">

        <p:panelGrid columns="4" styleClass="ui-fluid">

            <p:row>
                <p:column colspan="1">
                    <p:outputLabel for="name" value="${msg.contractNameLabel}" />
                </p:column>
                <p:column colspan="3" style="width: 75%">
                    <p:inputText id="name" value="#{contractEditBean.contract.name}" required="true" />
                </p:column>
            </p:row>

            <p:outputLabel for="startDate" value="${msg.contractStartDateLabel}" />
            <p:datePicker id="startDate" value="#{contractEditBean.contract.startDate}" required="true"
                          showIcon="true" locale="de" pattern="dd.MM.yyyy" />

            <p:outputLabel for="endDate" value="${msg.contractEndDateLabel}" />
            <p:datePicker id="endDate" value="#{contractEditBean.contract.endDate}"
                          showIcon="true" pattern="dd.MM.yyyy" />

            <p:outputLabel for="frequency" value="${msg.contractFrequencyLabel}" />
            <p:selectOneMenu id="frequency" value="#{contractEditBean.contract.frequency}" required="true">
                <f:selectItem itemLabel="Select Frequency" itemValue="" />
                <f:selectItems value="#{contractEditBean.frequencies}" var="freq"
                               itemLabel="#{freq.displayName}" itemValue="#{freq}" />
            </p:selectOneMenu>

            <p:outputLabel for="hoursPerWeek" value="${msg.contractHoursPerWeekLabel}" />
            <p:inputNumber id="hoursPerWeek" value="#{contractEditBean.contract.hoursPerWeek}"
                           required="true" minValue="0" maxValue="168" decimalPlaces="1" />

            <p:outputLabel for="workingDaysPerWeek" value="${msg.contractWorkingDaysPerWeekLabel}" />
            <p:inputNumber id="workingDaysPerWeek" value="#{contractEditBean.contract.workingDaysPerWeek}"
                           required="true" minValue="1" maxValue="7" decimalPlaces="0" />

            <p:outputLabel for="vacationDaysPerYear" value="${msg.contractVacationDaysPerYearLabel}" />
            <p:inputNumber id="vacationDaysPerYear" value="#{contractEditBean.contract.vacationDaysPerYear}"
                           required="true" minValue="0" maxValue="365" decimalPlaces="0" />


            <p:outputLabel for="employee" value="${msg.contractEmployee}" />
            <p:autoComplete id="employee" value="#{contractEditBean.employee}" required="true"
                            completeMethod="#{contractEditBean.completeText}" var="person"
                            itemLabel="#{contractEditBean.getFullName(person)}" itemValue="#{person}"
                            converter="personConverter"
                            scrollHeight="250" />

            <p:outputLabel for="supervisor" value="${msg.contractSupervisor}" />
            <p:autoComplete id="supervisor" value="#{contractEditBean.supervisor}" required="true"
                            completeMethod="#{contractEditBean.completeText}" var="person" style="width: 100%"
                            itemLabel="#{contractEditBean.getFullName(person)}" itemValue="#{person}"
                            converter="personConverter"
                            scrollHeight="250" />
            <p:row>
                <p:column colspan="1">
                    <p:outputLabel for="secretaries" value="${msg.contractSecretaries}" />
                </p:column>
                <p:column colspan="3" style="width: 75%;">
                    <p:autoComplete id="secretaries" multiple="true" value="#{contractEditBean.secretaries}"
                                    required="true"
                                    completeMethod="#{contractEditBean.completeText}" showEmptyMessage="false"
                                    var="person" itemLabel="#{contractEditBean.getFullName(person)}"
                                    itemValue="#{person}" converter="personConverter"
                                    forceSelection="true" scrollHeight="250">
                        <p:column>
                            <span class="flag" style="width: 30px; height: 20px" />
                            <h:outputText style="vertical-align: middle; margin-left: .5rem"
                                          value="#{contractEditBean.getFullName(person)}" />
                        </p:column>
                    </p:autoComplete>
                </p:column>
            </p:row>
            <p:row>
                <p:column colspan="1">
                    <p:outputLabel for="assistants" value="${msg.contractAssistants}" />
                </p:column>
                <p:column colspan="3" style="width: 75%;">
                    <p:autoComplete id="assistants" multiple="true" value="#{contractEditBean.assistants}"
                                    completeMethod="#{contractEditBean.completeText}" showEmptyMessage="false"
                                    var="person" itemLabel="#{contractEditBean.getFullName(person)}"
                                    itemValue="#{person}" converter="personConverter"
                                    forceSelection="true" scrollHeight="250">
                        <p:column>
                            <span class="flag" style="width: 30px; height: 20px" />
                            <h:outputText style="vertical-align: middle; margin-left: .5rem"
                                          value="#{contractEditBean.getFullName(person)}" />
                        </p:column>
                    </p:autoComplete>
                </p:column>
            </p:row>
        </p:panelGrid>

        <p:divider />


        <p:commandButton value="${msg.saveButtonLabel}"
                         action="#{contractEditBean.save}"
                         icon="pi pi-save"
                         process="@form" />
        <p:button value="${msg.cancelButtonLabel}"
                  outcome="contractList"
                  icon="pi pi-times" />
    </p:dialog>
</ui:composition>
