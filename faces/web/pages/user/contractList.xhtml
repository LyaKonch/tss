<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:comp="jakarta.faces.composite/comp">

    <ui:param name="pageHeadline" value="${msg.contractListHeadline}" />
    <!--    <f:param />    &lt;!&ndash; Use jakarta.faces.core - else might be autoremoved by IntelliJ &ndash;&gt;-->

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="description" value="Shows a list of contracts the user is involved in." />
        </f:metadata>
    </ui:define>

    <ui:define name="content">

        <h:form id="detailsForm">
            <ui:include src="contractDetails.xhtml" />
        </h:form>

        <h:form id="editForm">
            <ui:include src="contractEdit.xhtml" />
        </h:form>

        <h:form id="tableForm">
            <p:panel>
                <p:dataTable id="contractTable" var="contract" reflow="true" stripedRows="true"
                             value="#{contractListBean.contractList}">

                    <p:column field="name" headerText="${msg.contractNameLabel}" filterMatchMode="contains" />

                    <p:column field="startDate" headerText="${msg.contractStartDateLabel}"
                              filterBy="#{contractListBean.formatDate(contract.startDate)}" filterMatchMode="contains">
                        #{contractListBean.formatDate(contract.startDate)}
                    </p:column>

                    <p:column field="endDate" headerText="${msg.contractEndDateLabel}"
                              filterBy="#{contractListBean.formatDate(contract.endDate)}" filterMatchMode="contains">
                        #{contractListBean.formatDate(contract.endDate)}
                    </p:column>

                    <p:column field="status" headerText="${msg.contractStatusLabel}" filterMatchMode="contains">
                        <comp:coloredLabel
                                color="#{contract.status.color}">#{contract.status.displayName}
                        </comp:coloredLabel>
                    </p:column>

                    <p:column headerText="${msg.contractActionsLabel}" styleClass="flex align-items-center gap-2">
                        <p:commandButton icon="pi pi-eye"
                                         styleClass="ui-button-secondary ui-button-rounded ui-button-outlined icon-fix"
                                         action="#{contractListBean.prepareDetails(contract)}"
                                         update=":detailsForm"
                                         oncomplete="PF('detailsDialog').show();" />
                        <p:commandButton icon="pi pi-pencil"
                                         styleClass="ui-button-secondary ui-button-rounded ui-button-outlined icon-fix"
                                         action="#{contractListBean.prepareEdit(contract)}"
                                         rendered="#{contractListBean.canEdit(contract)}"
                                         update=":editForm"
                                         oncomplete="PF('editDialog').show();" />
                        <p:commandButton icon="pi pi-play"
                                         styleClass="ui-button-secondary ui-button-rounded ui-button-outlined icon-fix"
                                         rendered="#{contractListBean.canStart(contract)}"
                                         action="#{contractListBean.startContract(contract)}"
                                         update=":tableForm" title="${msg.contractStartTooltip}" />
                        <p:commandButton icon="pi pi-stop"
                                         styleClass="ui-button-secondary ui-button-rounded ui-button-outlined icon-fix"
                                         rendered="#{contractListBean.canTerminate(contract)}"
                                         action="#{contractListBean.terminateContract(contract)}"
                                         update=":tableForm" title="${msg.contractTerminateTooltip}" />
                        <p:commandButton icon="pi pi-trash"
                                         styleClass="ui-button-secondary ui-button-rounded ui-button-outlined icon-fix"
                                         rendered="#{contractListBean.canDelete(contract)}"
                                         action="#{contractListBean.deleteContract(contract)}"
                                         update=":tableForm" title="${msg.contractDeleteTooltip}" />
                        <p:commandButton icon="pi pi-times"
                                         styleClass="ui-button-secondary ui-button-rounded ui-button-outlined icon-fix"
                                         rendered="#{contractListBean.canAbort(contract)}"
                                         action="#{contractListBean.abortContract(contract)}"
                                         update=":tableForm" title="${msg.contractAbortTooltip}" />
                    </p:column>

                </p:dataTable>
            </p:panel>
        </h:form>

        <h:form id="buttonForm">
            <p:panel>
                <p:commandButton icon="pi pi-plus" value="${msg.contractEditNew}"
                                 rendered="#{authorization.isUserInRole('ADMIN') or authorization.isUserInRole('STAFF')}"
                                 action="#{contractListBean.prepareCreate()}"
                                 update=":editForm"
                                 oncomplete="PF('editDialog').show();" />
            </p:panel>
        </h:form>

    </ui:define>
</ui:composition>
