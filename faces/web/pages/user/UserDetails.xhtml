<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">
        #{msg['app.title']}
    </ui:define>

    <ui:define name="content">
        <style>

            .panel {
                max-width: 900px;
                margin: 20px auto;
                border-radius: 14px;
                padding: 18px; /* wirkt auf Content */
                box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
                border: 1px solid #e5e7eb;
            }

            .ui-panel .ui-panel-titlebar {
                padding: .6rem 1rem;
            }

            .pf-title-wrap {
                display: flex;
                flex-direction: column;
            }

            .pf-title {
                font-weight: 700;
                line-height: 1.1;
            }

            .pf-subtitle {
                color: #777;
                font-size: .8rem;
                margin-top: 2px;
            }

            .two-cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            @media (max-width: 768px) {
                .two-cols {
                    grid-template-columns: 1fr;
                }
            }

            .field-label {
                display: flex;
                align-items: center;
                gap: .5rem;
                font-weight: 600;
                color: #333;
                margin-bottom: .4rem;
            }

            .p-inputtext[readonly] {
                background: #f3f4f6;
                border-color: #e5e7eb;
            }

            .readbox {
                width: 100%;
                height: 44px;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                background: #f3f4f6;
                color: #111;
                display: flex;
                align-items: center;
                padding: 0 12px;
                box-sizing: border-box;
            }

            .role-chip {
                display: inline-block;
                font-size: .75rem;
                line-height: 1;
                padding: .35rem .6rem;
                border-radius: 999px;
                background: #e9edf3;
            }
        </style>

        <h:form id="userForm" styleClass="ui-fluid">
            <p:messages id="msgs" showDetail="true" closable="true"><p:autoUpdate /></p:messages>

            <p:panel styleClass="panel">
                <f:facet name="header">
                    <div class="pf-title-wrap">
                        <span class="pf-title">#{msg['app.title']}</span>
                        <span class="pf-subtitle">#{msg['view.subtitle']}</span>
                    </div>
                </f:facet>

                <div class="two-cols">

                    <!-- Name -->
                    <div>
                        <div class="field-label"><i class="pi pi-id-card"></i><span>#{msg['user.name']}</span></div>
                        <p:inputText id="fullName" value="#{userDetailsBean.fullName}" readonly="true"
                                     style="width:100%" />
                    </div>

                    <!-- Mail -->
                    <div>
                        <div class="field-label"><i class="pi pi-envelope"></i><span>#{msg['user.email']}</span></div>
                        <p:inputText id="email"
                                     value="#{empty userDetailsBean.person.emailAddress ? '-' : userDetailsBean.person.emailAddress}"
                                     readonly="true" style="width:100%" />
                    </div>

                    <!-- Birth -->
                    <div>
                        <div class="field-label"><i class="pi pi-calendar"></i><span>#{msg['user.birthDate']}</span>
                        </div>
                        <p:inputText id="birth" value="#{userDetailsBean.birthDate}" readonly="true"
                                     style="width:100%" />
                    </div>
                </div>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
