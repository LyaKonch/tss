<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">Person Form</ui:define>

    <ui:define name="content">
        <h:form id="personForm">
            <p:panelGrid columns="2">
                <f:facet name="header">
                    Create New Person
                </f:facet>

                <h:outputLabel for="firstName" value="First Name:" />
                <p:inputText id="firstName" value="#{personFormBean.personDTO.firstName}" required="true" />

                <h:outputLabel for="lastName" value="Last Name:" />
                <p:inputText id="lastName" value="#{personFormBean.personDTO.lastName}" required="true" />

                <h:outputLabel for="emailAddress" value="Email:" />
                <p:inputText id="emailAddress" value="#{personFormBean.personDTO.emailAddress}" required="true" />

                <h:outputLabel for="dateOfBirth" value="Date of Birth:" />
                <p:calendar id="dateOfBirth" value="#{personFormBean.personDTO.dateOfBirth}" pattern="yyyy-MM-dd" />

                <h:outputLabel for="federalState" value="Federal State:" />
                <p:selectOneMenu id="federalState" value="#{personFormBean.personDTO.state}">
                    <f:selectItem itemLabel="Select One" itemValue="#{null}" />
                    <f:selectItems value="#{personFormBean.federalStates}" var="state" itemLabel="#{state.name()}" />
                </p:selectOneMenu>

                <h:outputLabel for="consent" value="Consent:" />
                <p:selectBooleanCheckbox id="consent" value="#{personFormBean.personDTO.consent}" />

                <f:facet name="header">
                    Create User Account
                </f:facet>

                <h:outputLabel for="password" value="Password:" />
                <p:password id="password" value="#{personFormBean.password}" required="true" />

                <h:outputLabel for="userGroup" value="User Group:" />
                <p:selectOneMenu id="userGroup" value="#{personFormBean.selectedGroup}" required="true">
                    <f:selectItem itemLabel="Select Group" itemValue="#{null}" />
                    <f:selectItems value="#{personFormBean.groupNames}" var="group" itemLabel="#{group.name()}" itemValue="#{group}"/>
                </p:selectOneMenu>

                <f:facet name="footer">
                    <p:commandButton value="Create Person" action="#{personFormBean.savePerson()}" update="@form" />
                </f:facet>
            </p:panelGrid>
        </h:form>
    </ui:define>

</ui:composition>
