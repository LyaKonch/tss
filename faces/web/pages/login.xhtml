<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui">
    <ui:param name="pageHeadline" value="${msg.loginPageHeadline}"/>
    
    <ui:define name="content">
        <!--
                <p:card>
        ${msg.loginInfoMessage}
             </p:card>
        -->
        <!-- it's not possible to use an h:form for the login dialog -->
        <!-- since login is *not* processed by JSF -->
        <form class="form form-horizontal" role="form" action="dashboard" method="post" name="loginForm">
            <span class="hspace"/>
            <span class="hspace"/>
            <div class="field">
                    <span class="ui-float-label">
                        <p:inputText />
                        <p:outputLabel for="@previous" value="${msg.loginUsernameLabel}" />
                    </span>
                </div>
<span class="whitespace"/>
<span class="hspace"/>

               <div class="field">
                    <span class="ui-float-label">
                        <p:inputText id="password" type="password"
                       class="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all col-4 p-1 ui-state-filled" />
                        <p:outputLabel for="@previous" value="${msg.loginPasswordLabel}" />
                    </span>
                </div>
<span class="hspace"/>
<span class="hspace"/>

            <button id="loginButton"
                    class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-icon-left"
                    type="submit">
                <span class="ui-button-icon-left ui-icon ui-c pi pi-sign-in"></span>
                <span class="ui-button-text ui-c">${msg.loginButtonLabel}</span>
            </button>
        </form>
    </ui:define>
</ui:composition>
