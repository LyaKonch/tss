<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <h:outputStylesheet library="css" name="primeflex.css" />
    <h:outputStylesheet library="css" name="contracts.css" />
    <title>Bravo TSS - <ui:insert name="title">Default Title</ui:insert></title>
</h:head>
<h:body>
    <f:view locale="#{userSessionBean.locale}">
        <div id="header">
            <h:form id="headerMenuForm">
                <p:menubar>
                    <p:menuitem outcome="entries" value="Entries" icon="pi pi-home" />
                    <p:menuitem outcome="contractList" value="Contract List" icon="pi pi-list" />
                    <p:submenu label="Language" icon="pi pi-globe">
                        <p:menuitem value="Deutsch" action="#{userSessionBean.setLocale('de')}" update="@all" />
                        <p:menuitem value="English" action="#{userSessionBean.setLocale('en')}" update="@all" />
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>

        <div id="content">
            <ui:insert name="content" />
        </div>

       
            <div id="footer">
                    <p:panel>
                        <div>
                            ${msg.footerCurrentUserLabel}
                            ${loginBean.isLoggedIn ? loginBean.whoAmI.email : msg.notLoggedIn}
                            <span class="hspace"/>
                            <p:chip rendered="${loginBean.whoAmI.user}" label="${msg.userLabel}" styleClass="mr-22"/>
                            <span class="hspace"/>
                            <p:chip rendered="${loginBean.whoAmI.stuff}" label="${msg.staffLabel}" styleClass="mr-22"/>
                            <span class="hspace"/>
                            <p:chip rendered="${loginBean.whoAmI.admin}" label="${msg.adminLabel}" styleClass="mr-22"/>
                        </div>
                        <h:form id="localeForm">
                          
                        </h:form>
                        <div class="topsep">
                          
                            <h:outputText value="${userSessionBean.currentDate}">
                                <f:convertDateTime/>
                            </h:outputText>
                        </div>
                        <div class="topsep">
                            <h:outputFormat value="${msg.footerLabel}"/>
                           
                        </div>
                    </p:panel>
                </div>
       
    </f:view>
</h:body>
</html>
