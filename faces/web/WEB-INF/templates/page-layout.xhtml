<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <h:outputStylesheet library="css" name="primeflex.css" />
    <h:outputStylesheet library="css" name="contracts.css" />
    <title>Bravo TSS - <ui:insert name="title">Default Title</ui:insert></title>
</h:head>
<h:body>
    <f:view locale="#{userSessionBean.locale}">
        <div id="header">
            <h:form id="headerMenuForm">
                <p:menubar>
                    <p:menuitem outcome="entries" value="Entries" icon="pi pi-home" />
                    <p:menuitem outcome="contractList" value="Contract List" icon="pi pi-list" />
                    <!-- New -->
                    <p:menuitem value="#{msg['menu.userDetails']}" outcome="userDetails" icon="pi pi-user" />
                    <p:submenu label="Language" icon="pi pi-globe">
                        <p:menuitem value="Deutsch" action="#{userSessionBean.setLocale('de')}" update="@all" />
                        <p:menuitem value="English" action="#{userSessionBean.setLocale('en')}" update="@all" />
                        
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>

        <div id="content">
            <ui:insert name="content" />
        </div>

        <div id="footer">
            <p>Bravo Timesheet System</p>
        </div>
    </f:view>
</h:body>
</html>
