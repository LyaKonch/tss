<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <h:outputStylesheet library="css" name="primeflex.css" />
    <h:outputStylesheet library="css" name="contracts.css" />
    <title>Bravo TSS - <ui:insert name="title">Default Title</ui:insert></title>
</h:head>
<h:body>
    <f:view locale="#{userSessionBean.locale}">
        <div id="header">
            <h:form id="headerMenuForm">
                <p:dialog id="consentDialog"
                          widgetVar="consentDialog"
                          resizable="false"
                          closable="false"
                          modal="true"
                          rendered="#{not authorization.userHasConsent}">
                    <h:outputText value="As a user, I agree to the use of this system. Do you agree to the use of your information?"/>
                    <p:separator/>
                    <p:commandButton value="Yes"
                                     action="#{authorization.updateUserConsent}"
                                     oncomplete="window.location.reload()" />
                    <p:commandButton value="No"
                                     action="#{loginBean.logout}"
                                     immediate="true"
                                     styleClass="ui-button-danger" />
                </p:dialog>
                <h:outputScript rendered="#{not authorization.userHasConsent}" target="body">
                    if (typeof PF !== 'undefined' &amp;&amp; PF('consentDialog')) {
                    PF('consentDialog').show();
                    } else {
                    setTimeout(function(){
                    if (typeof PF !== 'undefined' &amp;&amp; PF('consentDialog')) {
                    PF('consentDialog').show();
                    }
                    }, 200);
                    }
                </h:outputScript>
                <p:menubar>
                    <p:menuitem outcome="entries" value="Entries" icon="pi pi-home" />
                    <p:menuitem outcome="contractList" value="Contract List" icon="pi pi-list" />
                    <p:menuitem outcome="personForm" value="Persons" icon="pi pi-users"
                                rendered='#{authorization.isUserInRole("ADMIN")}' />
                    <p:submenu label="Language" icon="pi pi-globe">
                        <p:menuitem value="Deutsch" action="#{userSessionBean.setLocale('de')}" update="@all" />
                        <p:menuitem value="English" action="#{userSessionBean.setLocale('en')}" update="@all" />
                    </p:submenu>
                    <p:menuitem outcome="toLoginForm" value="Sign out" icon="pi pi-users"
                                action='#{loginBean.logout}' />
                </p:menubar>
            </h:form>
        </div>

        <div id="content">
            <ui:insert name="content" />
        </div>

        <div id="footer">
            <p>Bravo Timesheet System</p>
        </div>
    </f:view>
</h:body>
</html>
